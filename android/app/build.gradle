plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.quickcapture'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.quickcapture'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    sourceSets {
        // shared/rules.json is the single source of truth for categories and tags (also used on Windows)
        main.assets.srcDirs += ['../../shared']
    }
}
// No third-party dependencies: framework APIs only.
